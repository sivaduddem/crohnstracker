name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  api-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e packages/shared/python
          pip install -r apps/api/requirements.txt
          pip install pillow numpy pytest
      - name: Generate demo fixtures
        run: python ml/data/generate_demo_fixtures.py
      - name: Run tests
        env:
          APP_MODE: demo
          PYTHONPATH: .
        run: pytest apps/api/tests tests -q

  web-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install and typecheck
        working-directory: apps/web
        run: |
          npm install
          npm run typecheck
